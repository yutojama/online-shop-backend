services:

  ###  db services: ###

  product-service-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/product-service-db:/var/lib/postgresql
    ports:
      - "5000:5432"

  keycloak-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/keycloak-db:/var/lib/postgresql
    ports:
      - "5001:5432"
    networks:
      - internal

  user-service-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/user-service-db:/var/lib/postgresql
    ports:
      - "5002:5432"

  auth-token-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/auth-token-db:/var/lib/postgresql
    ports:
      - "5003:5432"

  order-service-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/order-service-db:/var/lib/postgresql
    ports:
      - "5004:5432"

  shipping-service-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/shipping-service-db:/var/lib/postgresql
    ports:
      - "5005:5432"

  payment-service-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: password
      POSTGRES_USER: admin_user
    volumes:
      - ../db_volume/payment-service-db:/var/lib/postgresql
    ports:
      - "5006:5432"

  ###  other services: ###

  portshop-keycloak:
    image: keycloak/keycloak:26.7
    environment:
      KC_BOOTSTRAP_ADMIN_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin_user
      KC_DB: postgres
      KC_DB_PASSWORD: password
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: admin_user
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    ports:
      - "8081:8080"
    command:
      - start
    networks:
      - internal

  portshop-kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_NODE_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
    ports:
      - "9092:9092"


  ### frontend ###
  portshop-frontend:
    image: portshop/frontend:latest
    environment:
      API_GATEWAY_URL: http://host.docker.internal:4000
    ports:
      - "5173:80"



### settings ###

networks:
  internal:
    external: true