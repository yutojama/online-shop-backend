spring:
  application:
    name: shipping-service
  config:
    import: vault://
  cloud:
    vault:
      host: ${VAULT_HOST}
      port: 8200
      scheme: http
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: kv
        default-context: shipping-service

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}

  kafka:
    bootstrap-servers: ${KAFKA_SERVICE_URL}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "ShipmentDTO:com.portshop.shipping_service.dto.ShipmentDTO"

    consumer:
      group-id: shipping-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: >- 
          PaymentDTO:com.portshop.shipping_service.dto.PaymentDTO,
          OrderDTO:com.portshop.shipping_service.dto.orderDTO.OrderDTO
        spring.json.trusted.packages: "com.portshop.shipping_service.dto"

server:
  port: 4005

app:
  kafka:
    topic:
      shipping:
        partitions: ${KAFKA_SHIPPING_PARTITIONS}
        replicas: ${KAFKA_SHIPPING_REPLICAS}