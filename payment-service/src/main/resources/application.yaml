spring:
  application:
    name: payment-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}

  kafka:
    bootstrap-servers: ${KAFKA_SERVICE_URL}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: "PaymentDTO:com.portshop.payment_service.dto.PaymentDTO"

    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: "OrderDTO:com.portshop.payment_service.dto.orderDTO.OrderDTO"
        spring.json.trusted.packages: "com.portshop.payment_service.dto"

server:
  port: 4004