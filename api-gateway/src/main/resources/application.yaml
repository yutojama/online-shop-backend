spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service-public
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/public/images/**, /public/products/**, /public/items/**

            - id: product-service-private
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**, /api/items/**,
              filters:
                - JwtValidation

#            /api/users/** should be hidden for any visitors. It's accessible only for webClient from microservices -> change from /api/users to /webClient/users
            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/addresses/**, /admin/users/**, /api/users/**
              filters:
                - JwtValidation

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**, /api/carts/**
              filters:
                - JwtValidation

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/payment/**
              filters:
                - JwtValidation


#            - id: shipping-service
#              uri: ${SHIPPING_SERVICE_URL}
#              predicates:
#                - Path=/api/shipping/**
#              filters:
#                - JwtValidation


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}

server:
  port: 4000

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}
  order-service:
    url: ${ORDER_SERVICE_URL}
  payment-service:
    url: ${PAYMENT_SERVICE_URL}
  shipping-service:
    url: ${SHIPPING_SERVICE_URL}

keycloak:
  token-url: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: DEBUG
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: TRACE