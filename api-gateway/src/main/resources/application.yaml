spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**, /api/items/**
              filters:
                - JwtValidation

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/users/**, /api/addresses/**, /admin/users/**
              filters:
                - JwtValidation

            - id: order-service
              uri: ${ORDER_SERVICE_URL}
              predicates:
                - Path=/api/orders/**, /api/carts/**
              filters:
                - JwtValidation

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL}
              predicates:
                - Path=/api/payment/**
              filters:
                - JwtValidation

            - id: shipping-service
              uri: ${SHIPPING_SERVICE_URL}
              predicates:
                - Path=/api/shipping/**
              filters:
                - JwtValidation

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL}
              predicates:
                - Path=/api/notification/**
              filters:
                - JwtValidation

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}

server:
  port: 4000

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}
  order-service:
    url: ${ORDER_SERVICE_URL}
  payment-service:
    url: ${PAYMENT_SERVICE_URL}
  shipping-service:
    url: ${SHIPPING_SERVICE_URL}
  notification-service:
    url: ${NOTIFICATION_SERVICE_URL}

keycloak:
  token-url: ${KEYCLOAK_SERVER_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token