spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL}
              predicates:
                - Path=/api/products/**, /api/items/**
              filters:
                - proxyAccessToken

            - id: user-service
              uri: ${USER_SERVICE_URL}
              predicates:
                - Path=/api/users/**, /api/addresses/**, /admin/users/**
              filters:
                - proxyAccessToken

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUE_URI}

server:
  port: 4000

app:
  product-service:
    url: ${PRODUCT_SERVICE_URL}
  user-service:
    url: ${USER_SERVICE_URL}