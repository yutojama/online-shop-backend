spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: http://localhost:4001
              predicates:
                - Path=/api/products/**, /api/items/**
              filters:
                - StripPrefix=1

            - id: user-service
              uri: http://localhost:4002
              predicates:
                - Path=/api/users/**, /api/addresses/**, /api/admin/**
              filters:
                - StripPrefix=1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/portshop-realm
server:
  port: 4000